[pytest]
# --strict-markers: an unregistered marker is an ERROR, not a warning. A
# typo'd @pytest.mark.slwo would otherwise silently mark nothing and the
# test would keep running in the fast tier while looking excluded.
addopts = --strict-markers
markers =
    slow: end-to-end tests that drive the pipeline entry point and train a
        real (tiny) model. They cannot use the cached-ancestor fixtures --
        running stage 1 IS what they test -- so their cost is intrinsic,
        not overhead to be optimised away. Deselect during rapid iteration
        with `-m "not slow"`; ALWAYS run the full suite before delivering.
